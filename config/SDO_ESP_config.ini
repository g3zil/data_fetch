[ESP]
# Single UTC day required, format YYYY-MM-DD
DATE = 2026-10-08

# Averaging interval in seconds
CADENCE = 3

# Optional: trim the day to a time window (UTC, HH:MM). Defaults give the whole day.
START_TIME = 15:20
END_TIME = 15:45

# Optional: the file version suffix. 008 is currently common to all files.
VERSION = 008

# Rate-of-change filters for the 30.4 nm channel, applied to the 4 Hz data
# Savitzky-Golay: window length in seconds (rounded to an odd number of samples) and polynomial order
SAVGOL_WINDOW = 6
SAVGOL_POLYORDER = 3
# Gaussian first-derivative filter: sigma in seconds
GAUSS_SIGMA = 2
